[build-system]
# setuptools>=77 才有 PEP 639（license 写成 SPDX 串 + license-files），
# 也只有它会在 dist-info/licenses/ 里带上 LICENSE —— 两个平台必须用**同一档**
# 版本，否则同版本的两个 wheel 会产出不一样的 METADATA（老版本还不认 CRLF/LF 一致）。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nb-curl"
version = "0.3.2"
description = "自带浏览器 TLS/HTTP2 指纹的 HTTP 客户端（libcurl-impersonate + BoringSSL）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# 把仓库根的 LICENSE 打进 wheel 的 dist-info/licenses/，并生成 License-File 头。
# 不新增任何文件：LICENSE 本来就在仓库里，之前只是没配进包元数据。
license-files = ["LICENSE"]
keywords = ["curl", "impersonate", "ja3", "ja4", "akamai", "tls-fingerprint", "http2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    # CFFI API 模式扩展运行期依赖 _cffi_backend，所以 cffi 是默认依赖。
    # 如果你只想要 ctypes 后端（零第三方依赖），可以 pip install --no-deps。
    "cffi>=1.15; implementation_name == 'cpython'",
    # CA 证书已内置在 nb_curl/_lib/cacert.pem，certifi 不是必需的。
    # 参数用 PEP 692 的 Unpack[TypedDict] 声明（见 nb_curl/params.py）：
    # 3.11+ 用 typing.Unpack，3.9/3.10 才需要 typing_extensions（仅类型检查器用）。
    "typing_extensions>=4.4; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/touxigua00/nb-curl"
Repository = "https://github.com/touxigua00/nb-curl"
Issues = "https://github.com/touxigua00/nb-curl/issues"
Changelog = "https://github.com/touxigua00/nb-curl/releases"

[project.optional-dependencies]
# 想让 CA 根证书跟随 certifi 自动更新（否则用包内快照）
certifi = ["certifi>=2023.7.22"]
# 需要构建 wheel / 重编 CFFI 扩展时
build = ["setuptools>=64", "wheel", "cffi>=1.15"]
test = []

[tool.setuptools]
packages = ["nb_curl"]
include-package-data = true

[tool.setuptools.package-data]
nb_curl = [
    # 各平台动态库
    "_lib/nb_curl_native.dll",
    "_lib/libnb_curl_native.so",
    "_lib/libnb_curl_native.dylib",
    # 内置 CA 快照
    "_lib/cacert.pem",
    # CFFI API 模式扩展
    "*.pyd",
    "*.so",
    "*.dylib",
    # PEP 561 类型标记：让 IDE 按带类型注解的包对待（补全/参数提示/跳转）
    "py.typed",
]
